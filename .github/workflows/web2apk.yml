name: Web to APK Builder

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL Website yang ingin diubah jadi APK'
        required: true
        default: 'https://google.com'
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'MyWebApp'
      package_id:
        description: 'Package ID (e.g. com.mycompany.app)'
        required: false
        default: 'com.web2apk.app'

jobs:
  create-web2apk:
    runs-on: ubuntu-latest
    steps:
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🚀 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: 🛠️ Generate Flutter WebView Project
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          TARGET_URL="${{ github.event.inputs.target_url }}"
          PACKAGE_ID="${{ github.event.inputs.package_id }}"
          
          flutter create --org com.web2apk --project-name web_app .
          flutter pub add webview_flutter
          
          # Inisialisasi WebView di main.dart
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const MaterialApp(home: WebAppView(), debugShowCheckedModeBanner: false));

          class WebAppView extends StatefulWidget {
            const WebAppView({super.key});
            @override
            State<WebAppView> createState() => _WebAppViewState();
          }

          class _WebAppViewState extends State<WebAppView> {
            late final WebViewController _controller;

            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(Uri.parse('${TARGET_URL}'));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(child: WebViewWidget(controller: _controller)),
              );
            }
          }
          EOF

      - name: 📦 Build Web2APK Release
        run: |
          flutter build apk --release

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
